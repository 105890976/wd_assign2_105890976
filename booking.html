<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/placeholder.jpg" alt="Acinima Logo">
            <span>Acinima</span>
        </div>
        <!-- hamburger button for mobile/tablet nav -->
        <button class="hamburger" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <!-- Navigation -->
        <!-- add class="nav-item active" for current page -->
        <nav class="nav" id="nav-bar">
            <ul>
                <li><a href="index.html" class="nav-item">Home</a></li>
                <li><a href="movies.html" class="nav-item">Movies</a></li>
                <li><a href="recommend.html" class="nav-item">Recommendations</a></li>
                <li><a href="register.html" class="nav-item">Register</a></li>
                <li><a href="booking.html" class="nav-item active">Book Tickets</a></li>
                <li><a href="watchlist.html" class="nav-item">Watchlist</a></li>
            </ul>
        </nav>
    </header> 
    <!-- Main content -->
    <main>
        <div class="centered">
            <section>
                <h2>Book Tickets</h2>
                <p>Book tickets for an upcoming movie showing</p>
                <form id="form-book" method="post" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php">
                    <fieldset>
                        <legend>Personal Information</legend>
                        <div class="textinput">
                            <label for="fname">First Name</label>
                            <input id="fname" type="text" name="fname"/>
                        </div>
                        <div class="textinput">
                            <label for="lname">Last Name</label>
                            <input id="lname" type="text" name="lname"/>
                        </div>
                        <div class="textinput">
                            <label for="email">Email</label>
                            <input id="email" type="text" name="email"/>
                        </div>
                        <div class="textinput">
                            <label for="phone">Phone Number</label>
                            <input id="phone" type="text" name="phone"/>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Movie Details</legend>
                        <div class="dropdowninput">
                            <label for="movie">Movie Selection</label>
                            <select id="movie" name="movie">
                                <option value="">Select a movie</option>
                            </select>
                        </div>
                        <div class="textinput">
                            <label for="screening-date">Screening Date & Time</label>
                            <input type="datetime-local" id="screening-date" name="screening-date"/>
                        </div>
                        <div class="textinput">
                            <label for="num-tickets">Number of Tickets</label>
                            <input type="number" id="num-tickets" name="num-tickets" value="1"/>
                        </div>
                        <div class="dropdowninput">
                            <label for="tickettype">Ticket Type</label>
                            <select class="form-select" id="tickettype" name="tickettype">
                                <option value="">Select Ticket</option>
                                <option value="adult">Adult</option>
                                <option value="child">Child</option>
                                <option value="student">Student</option>
                                <option value="senior">Senior</option>
                            </select>
                        </div>
                        <div class="textinput">
                            <label for="requests">Special requests</label>
                            <textarea id="requests" name="requests" rows="3" cols="24" placeholder="Needs and requests"></textarea>
                        </div>
                        <div class="textinput">
                            <label for="total-price">Total Price</label>
                            <input id="total-price" type="text" name="total-price" readonly value="$0.00"/>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Payment Information</legend>
                        <div class="payment-row">
                            <span class="payment-label">Payment Method</span>
                            <div class="buttons">
                                <button type="button" id="voucher">Voucher</button>
                                <button type="button" id="card">Online Payment</button>
                            </div>
                        </div>
                        
                        <!-- payment detail fields are hidden until the associated option is picked -->
                        <div id="vouchercontainer">
                            <div class="textinput">
                                <label for="vouchercode">Voucher Code</label>
                                <input id="vouchercode" type="text" name="vouchercode" placeholder="xxxx xxxx xxxx"/>
                            </div>
                        </div>

                        <div id="paymentcontainer">
                            <div class="payment-row">
                                <span class="payment-label">Card Type</span>
                                <div class="buttons">
                                    <button type="button" id="visamaster">Visa/Mastercard</button>
                                    <button type="button" id="amex">Amex</button>
                                </div>
                            </div>
                            <div class="textinput">
                                <label for="cardnumber">Card Number</label>
                                <input id="cardnumber" type="text" name="cardnumber"/>
                            </div>
                            <div class="payment-row">
                                <span class="payment-label"></span>
                                <div class="buttons">
                                    <button type="button" id="aboveemail">Same as Email</button>
                                </div>
                            </div>
                            <div class="textinput">
                                <label for="billemail">Billing Email Address</label>
                                <input id="billemail" type="text" name="billemail"/>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Confirmation</legend>
                        <div class="buttoninput">
                            <input type="submit" value="Book Ticket(s)"/>
                            <input type="reset" value="Cancel Booking"/>
                        </div>
                    </fieldset>
                     
                </form>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Acinima. All rights reserved.</p>
    </footer>
</body>
</html>
