<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/placeholder.jpg" alt="Acinima Logo">
            <span>Acinima</span>
        </div>
        <!-- hamburger button for mobile/tablet nav -->
        <button class="hamburger" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <!-- Navigation -->
        <!-- add class="nav-item active" for current page -->
        <nav class="nav" id="nav-bar">
            <ul>
                <li><a href="index.html" class="nav-item">Home</a></li>
                <li><a href="movies.html" class="nav-item">Movies</a></li>
                <li><a href="recommend.html" class="nav-item active">Recommendations</a></li>
                <li><a href="register.html" class="nav-item">Register</a></li>
                <li><a href="booking.html" class="nav-item">Book Tickets</a></li>
                <li><a href="watchlist.html" class="nav-item">Watchlist</a></li>
            </ul>
        </nav>
    </header> 
    <!-- Main content -->
    <main>
        <div class="centered">
            <section>
                <h2>Movie Recommendation</h2>
                <p>Please enter your movie preferences.</p>
                
                <div id="recommendation-form">
                    <fieldset>
                        <legend>Preferences</legend>
                        <!-- genre select -->
                        <div class="dropdowninput">
                            <label for="rec-genre">Preferred Genre:</label>
                            <select id="rec-genre">
                                <option value="">All Genres</option>
                                <option value="Adventure">Adventure</option>
                                <option value="Si-fi">Si-fi</option>
                                <option value="Horror">Horror</option>
                                <option value="Drama">Drama</option>
                            </select>
                        </div>

                        <!-- age group select -->
                        <div class="dropdowninput">
                            <label for="rec-age">Age Group:</label>
                            <select id="rec-age">
                                <option value="">Any Age Group</option>
                                <option value="Child">Child</option>
                                <option value="Teen">Teen</option>
                                <option value="Adult">Adult</option>
                                <option value="Family">Family</option>
                            </select>
                        </div>

                        <!-- viewing with select -->
                        <div class="dropdowninput">
                            <label for="rec-viewing">Who are you watching with?</label>
                            <select id="rec-viewing">
                                <option value="">Anyone</option>
                                <option value="Family">Family</option>
                                <option value="Friends">Friends</option>
                                <option value="Solo">Solo</option>
                                <option value="Date Night">Date Night</option>
                            </select>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Confirmation</legend>
                        <button type="button" id="recommend-btn">Get Recommendations</button>
                    </fieldset>
                </div>
            </section>
        </div>
        <div id="recommendation-results" class="movies-grid-container"></div>
    </main>
    <footer>
        <p>&copy; 2026 Acinima. All rights reserved.</p>
    </footer>
</body>
</html>
